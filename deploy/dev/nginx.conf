# ==============================================================================
# 🚀 Nginx Reverse Proxy & Static File Server for OpenMetadata Frontend
# ==============================================================================

server {
    listen 80;
    server_name localhost;

    # Tối ưu kích thước body cho upload metadata, file, schema
    client_max_body_size 100M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # 1. Phục vụ Static Files (React/Vite SPA)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache control cho index.html (không cache để luôn nhận version mới)
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # Cache control cho assets tĩnh có mã hash (cache lâu để tăng tốc)
        location ~* \.(?:css|js|woff2?|ttf|eot|png|jpe?g|gif|svg|ico|webp)$ {
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable";
        }
    }

    # 2. Proxy REST APIs sang OpenMetadata Backend Server
    location /api/ {
        proxy_pass http://openmetadata-server:8585;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Timeouts cho các tác vụ export/import metadata dài
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # 3. Proxy OAuth / OIDC / SAML Login Callback
    location /callback {
        proxy_pass http://openmetadata-server:8585/callback;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. Proxy WebSocket (Feed, Thông báo, Audit Log Push)
    location /api/v1/push/feed {
        proxy_pass http://openmetadata-server:8585/api/v1/push/feed;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}
